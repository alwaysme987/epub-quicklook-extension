name: Build EPUBQuickLook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Root listing ==="
          ls -la
          echo "=== .xcodeproj location ==="
          find . -name "*.xcodeproj" -type d
          echo "=== EPUBQuickLookHost/ contents ==="
          ls -la EPUBQuickLookHost/
          echo "=== EPUBQuickLook/ contents ==="
          ls -la EPUBQuickLook/

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies             -project EPUBQuickLookHost.xcodeproj             -scheme EPUBQuickLookHost

      - name: Build Host App
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive             -project EPUBQuickLookHost.xcodeproj             -scheme EPUBQuickLookHost             -destination "platform=macOS"             -archivePath "build/EPUBQuickLookHost.xcarchive"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""             | tee build/host-archive.log

      - name: Build Quick Look Extension
        run: |
          set -euo pipefail
          xcodebuild archive             -project EPUBQuickLookHost.xcodeproj             -scheme EPUBQuickLook             -destination "platform=macOS"             -archivePath "build/EPUBQuickLook.xcarchive"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""             | tee build/extension-archive.log

      - name: Export and verify
        run: |
          set -euo pipefail
          echo "=== Build directory ==="
          ls -la build/
          echo "=== xcarchive products ==="
          ls -la build/EPUBQuickLookHost.xcarchive/Products/Applications/ || true
          echo "=== Find all .app ==="
          find build -name "*.app" -type d

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p staging
          APP_PATH="build/EPUBQuickLookHost.xcarchive/Products/Applications/EPUBQuickLookHost.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "EPUBQuickLookHost.app" -type d | head -1)
          fi
          echo "Using APP_PATH: $APP_PATH"
          cp -R "$APP_PATH" staging/
          ln -s /Applications staging/Applications
          hdiutil create             -volname "EPUBQuickLook"             -srcfolder staging             -ov             -format UDZO             "build/EPUBQuickLook.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUBQuickLook
          path: build/EPUBQuickLook.dmg
