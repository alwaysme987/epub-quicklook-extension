name: Build EPUBQuickLook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check directory structure
        run: |
          echo "=== Root listing ==="
          ls -la
          echo "=== Find .xcodeproj ==="
          find . -name "*.xcodeproj" -type d
          echo "=== EPUBQuickLookHost/ listing ==="
          ls -la EPUBQuickLookHost/ 2>/dev/null || echo "No EPUBQuickLookHost dir"

      - name: Resolve dependencies
        run: |
          cd EPUBQuickLookHost
          xcodebuild -resolvePackageDependencies             -project EPUBQuickLookHost.xcodeproj             -scheme EPUBQuickLookHost

      - name: Build Host App
        run: |
          set -euo pipefail
          mkdir -p build
          if [ -f "EPUBQuickLookHost.xcodeproj/project.pbxproj" ]; then
            PROJ_PATH="${GITHUB_WORKSPACE}/EPUBQuickLookHost.xcodeproj"
            WORK_DIR="${GITHUB_WORKSPACE}"
          else
            PROJ_PATH="${GITHUB_WORKSPACE}/EPUBQuickLookHost/EPUBQuickLookHost.xcodeproj"
            WORK_DIR="${GITHUB_WORKSPACE}/EPUBQuickLookHost"
          fi
          echo "Project: $PROJ_PATH"
          ARCHIVE_DIR="${GITHUB_WORKSPACE}/build"
          ARCHIVE_PATH="${ARCHIVE_DIR}/EPUBQuickLookHost.xcarchive"
          mkdir -p "$ARCHIVE_DIR"
          (
            cd "$WORK_DIR"
            xcodebuild archive               -project "$PROJ_PATH"               -scheme "EPUBQuickLookHost"               -destination "platform=macOS"               -archivePath "$ARCHIVE_PATH"               CODE_SIGN_IDENTITY=""               CODE_SIGNING_REQUIRED=NO               CODE_SIGNING_ALLOWED=NO               DEVELOPMENT_TEAM=""
          ) 2>&1 | tee build/host-archive.log || { echo "xcodebuild failed; last 200 lines:"; tail -n 200 build/host-archive.log ; exit 1; }

      - name: Build Quick Look Extension
        run: |
          set -euo pipefail
          mkdir -p build
          if [ -f "EPUBQuickLookHost.xcodeproj/project.pbxproj" ]; then
            WORK_DIR="${GITHUB_WORKSPACE}"
            PROJ_PATH="${GITHUB_WORKSPACE}/EPUBQuickLookHost.xcodeproj"
          else
            WORK_DIR="${GITHUB_WORKSPACE}/EPUBQuickLookHost"
            PROJ_PATH="${GITHUB_WORKSPACE}/EPUBQuickLookHost/EPUBQuickLookHost.xcodeproj"
          fi
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/build/EPUBQuickLook.xcarchive"
          (
            cd "$WORK_DIR"
            xcodebuild archive               -project "$PROJ_PATH"               -scheme "EPUBQuickLook"               -destination "platform=macOS"               -archivePath "$ARCHIVE_PATH"               CODE_SIGN_IDENTITY=""               CODE_SIGNING_REQUIRED=NO               CODE_SIGNING_ALLOWED=NO               DEVELOPMENT_TEAM=""
          ) 2>&1 | tee build/extension-archive.log || { echo "xcodebuild failed; last 200 lines:"; tail -n 200 build/extension-archive.log ; exit 1; }

      - name: Export Host App
        run: |
          set -euo pipefail
          mkdir -p build/Products
          echo "Searching for EPUBQuickLookHost.app under build..."
          APP_PATH=""
          if [ -d "build/EPUBQuickLookHost.xcarchive/Products/Applications/EPUBQuickLookHost.app" ]; then
            APP_PATH="build/EPUBQuickLookHost.xcarchive/Products/Applications/EPUBQuickLookHost.app"
          elif [ -d "build/EPUBQuickLook.xcarchive/Products/Applications/EPUBQuickLookHost.app" ]; then
            APP_PATH="build/EPUBQuickLook.xcarchive/Products/Applications/EPUBQuickLookHost.app"
          else
            APP_PATH=$(find build -type d -name "EPUBQuickLookHost.app" -print -quit || true)
          fi
          echo "Detected APP_PATH: ${APP_PATH:-<none>}"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Products/ || { echo "Copy failed"; ls -la "$(dirname "$APP_PATH")"; exit 1; }
          else
            echo "No EPUBQuickLookHost.app found. Listing build folder contents for debugging:"
            find build -maxdepth 3 -ls || true
            exit 1
          fi
          echo "Final app location:"
          find build -name "EPUBQuickLookHost.app" -type d -ls || true

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p staging
          APP_PATH=$(find build -type d -name "EPUBQuickLookHost.app" -print -quit || true)
          echo "APP_PATH found: ${APP_PATH:-<none>}"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" staging/
          else
            echo "App not found"
            ls -la
            find build -ls || true
            exit 1
          fi
          ln -s /Applications staging/Applications
          hdiutil create             -volname "EPUBQuickLook"             -srcfolder staging             -ov             -format UDZO             "build/EPUBQuickLook.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUBQuickLook
          path: build/EPUBQuickLook.dmg
